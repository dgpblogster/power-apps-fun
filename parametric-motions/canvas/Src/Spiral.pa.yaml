Screens:
  Spiral:
    Properties:
      Fill: =RGBA(13, 16, 27, 1)
      LoadingSpinnerColor: =RGBA(255, 200, 87, 1)
      OnVisible: |-
        =UpdateContext({ctxSpiN: 0, ctxSpiPlaying: true, ctxSpiMenu: false})
    Children:
      - btnSpiMenu:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(220, 226, 240, 1)
            Fill: =RGBA(255, 255, 255, 0.06)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: |-
              =UpdateContext({ctxSpiMenu: !ctxSpiMenu})
            PressedColor: =RGBA(220, 226, 240, 1)
            PressedFill: =RGBA(255, 255, 255, 0.03)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =16
            Text: ="☰"
            Width: =48
            X: =24
            Y: =24
      - lblSpiTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 200, 87, 1)
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="Spiral"
            Width: =500
            X: =88
            Y: =24
      - recSpiPlot:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.12)
            BorderThickness: =1
            Fill: =RGBA(18, 22, 36, 1)
            Height: =640
            Width: =640
            X: =40
            Y: =88
      - imgSpiTrail:
          Control: Image@2.2.3
          Properties:
            Height: =640
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'><polyline fill='none' stroke='#FFC857' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' points='" &
                Concat(
                  Sequence(ctxSpiN),
                  With(
                    {th: sldSpiTurns.Value * 2 * Pi() * Value / 600, rr: 290 * Value / 600},
                    Text(320 + rr * Cos(th), "0.0") & "," &
                    Text(320 - rr * Sin(th), "0.0")
                  ),
                  " "
                ) &
                "'/></svg>"
              )
            Width: =640
            X: =40
            Y: =88
      - crcSpiDot:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(255, 200, 87, 1)
            BorderThickness: =3
            Fill: =RGBA(255, 255, 255, 1)
            Height: =16
            Width: =16
            X: =40 + 320 + (290 * ctxSpiN / 600) * Cos(sldSpiTurns.Value * 2 * Pi() * ctxSpiN / 600) - Self.Width / 2
            Y: =88 + 320 - (290 * ctxSpiN / 600) * Sin(sldSpiTurns.Value * 2 * Pi() * ctxSpiN / 600) - Self.Height / 2
      - recSpiPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.12)
            BorderThickness: =1
            Fill: =RGBA(18, 22, 36, 1)
            Height: =640
            Width: =606
            X: =720
            Y: =88
      - lblSpiEq:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(205, 214, 232, 1)
            Height: =56
            Size: =14
            Text: ="r(θ) = a·θ      the Archimedean spiral grows by a constant amount each turn"
            Width: =542
            X: =752
            Y: =112
      - lblSpiTurns:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 162, 186, 1)
            Height: =22
            Size: =12
            Text: ="turns (full revolutions) = " & sldSpiTurns.Value
            Width: =542
            X: =752
            Y: =196
      - sldSpiTurns:
          Control: Classic/Slider@2.1.0
          Properties:
            Default: =5
            HandleFill: =RGBA(255, 200, 87, 1)
            Height: =44
            Max: =10
            Min: =2
            OnChange: |-
              =UpdateContext({ctxSpiN: 0})
            RailFill: =RGBA(255, 255, 255, 0.15)
            ShowValue: =false
            ValueFill: =RGBA(255, 200, 87, 0.7)
            Width: =542
            X: =752
            Y: =222
      - lblSpiSpeed:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 162, 186, 1)
            Height: =22
            Size: =12
            Text: ="tracer speed = " & sldSpiSpeed.Value
            Width: =542
            X: =752
            Y: =436
      - sldSpiSpeed:
          Control: Classic/Slider@2.1.0
          Properties:
            Default: =3
            HandleFill: =RGBA(255, 255, 255, 0.9)
            Height: =44
            Max: =10
            Min: =1
            RailFill: =RGBA(255, 255, 255, 0.15)
            ShowValue: =false
            ValueFill: =RGBA(255, 255, 255, 0.5)
            Width: =542
            X: =752
            Y: =462
      - lblSpiProg:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(150, 162, 186, 1)
            Height: =22
            Size: =12
            Text: ="path drawn — " & RoundDown(ctxSpiN / 6, 0) & "%"
            Width: =542
            X: =752
            Y: =516
      - btnSpiPlay:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 14, 24, 1)
            Fill: =RGBA(255, 200, 87, 1)
            Height: =48
            HoverColor: =RGBA(10, 14, 24, 1)
            HoverFill: =RGBA(255, 216, 130, 1)
            OnSelect: |-
              =UpdateContext({ctxSpiPlaying: !ctxSpiPlaying})
            PressedColor: =RGBA(10, 14, 24, 1)
            PressedFill: =RGBA(214, 166, 66, 1)
            Text: =If(ctxSpiPlaying, "Pause", "Resume")
            Width: =170
            X: =752
            Y: =556
      - btnSpiReset:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(230, 235, 246, 1)
            Fill: =RGBA(255, 255, 255, 0.08)
            Height: =48
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.14)
            OnSelect: |-
              =UpdateContext({ctxSpiN: 0, ctxSpiPlaying: true})
            PressedColor: =RGBA(230, 235, 246, 1)
            PressedFill: =RGBA(255, 255, 255, 0.04)
            Text: ="Restart"
            Width: =170
            X: =942
            Y: =556
      - tmrSpi:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =80
            Height: =24
            OnTimerEnd: |-
              =If(ctxSpiN < 600,
                UpdateContext({ctxSpiN: Min(600, ctxSpiN + sldSpiSpeed.Value)})
              )
            Repeat: =true
            Start: =ctxSpiPlaying
            Visible: =false
            Width: =120
            X: =1200
            Y: =740
      - lblSpiBrand:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(150, 162, 186, 1)
            Font: =Font.'Courier New'
            Height: =28
            Size: =14
            Text: ="// The Workbench"
            Width: =336
            X: =1006
            Y: =30
      - recSpiScrim:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.45)
            Height: =768
            OnSelect: |-
              =UpdateContext({ctxSpiMenu: false})
            Visible: =ctxSpiMenu
            Width: =1366
      - recSpiMenuBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(24, 29, 46, 1)
            Height: =768
            Visible: =ctxSpiMenu
            Width: =300
      - lblSpiMnuTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =16
            Text: ="Parametric Motions"
            Visible: =ctxSpiMenu
            Width: =252
            X: =24
            Y: =28
      - btnSpiMnuHome:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =48
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: =Navigate(Screen1, ScreenTransition.None)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 0.05)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Home"
            Visible: =ctxSpiMenu
            Width: =276
            X: =12
            Y: =100
      - btnSpiMnuLis:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderThickness: =0
            Color: =RGBA(79, 195, 247, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =48
            HoverColor: =RGBA(79, 195, 247, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: =Navigate(Lissajous, ScreenTransition.None)
            PressedColor: =RGBA(79, 195, 247, 1)
            PressedFill: =RGBA(255, 255, 255, 0.05)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Lissajous Curve"
            Visible: =ctxSpiMenu
            Width: =276
            X: =12
            Y: =156
      - btnSpiMnuRos:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderThickness: =0
            Color: =RGBA(255, 107, 157, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =48
            HoverColor: =RGBA(255, 107, 157, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: =Navigate(Rose, ScreenTransition.None)
            PressedColor: =RGBA(255, 107, 157, 1)
            PressedFill: =RGBA(255, 255, 255, 0.05)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Rose Curve"
            Visible: =ctxSpiMenu
            Width: =276
            X: =12
            Y: =212
      - btnSpiMnuSpi:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderThickness: =0
            Color: =RGBA(255, 200, 87, 1)
            Fill: =RGBA(255, 255, 255, 0.08)
            Height: =48
            HoverColor: =RGBA(255, 200, 87, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: |-
              =UpdateContext({ctxSpiMenu: false})
            PressedColor: =RGBA(255, 200, 87, 1)
            PressedFill: =RGBA(255, 255, 255, 0.05)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Spiral"
            Visible: =ctxSpiMenu
            Width: =276
            X: =12
            Y: =268
      - btnSpiMnuHyp:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Left
            BorderThickness: =0
            Color: =RGBA(124, 227, 139, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =48
            HoverColor: =RGBA(124, 227, 139, 1)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: =Navigate(Hypotrochoid, ScreenTransition.None)
            PressedColor: =RGBA(124, 227, 139, 1)
            PressedFill: =RGBA(255, 255, 255, 0.05)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Hypotrochoid"
            Visible: =ctxSpiMenu
            Width: =276
            X: =12
            Y: =324
