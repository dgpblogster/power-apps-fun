                ctxE12K: 1, ctxE12X: 24.5, ctxE12Y: 13.5, ctxE12S: If(12 <= ctxSlots, 1, 0), ctxE12H: 20, ctxE12T: 0, ctxE12V: false, ctxE12F: 0
              })
      - lblCredit:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Deep Station: an original game built in Power Fx. Not affiliated with id Software, ZeniMax, or Bethesda."
            Color: =RGBA(130, 140, 130, 1)
            Align: =Align.Left
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =9
            X: =203
            Y: =726
            Width: =960
            Height: =16
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =true
      - tmrGame:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Repeat: =true
            AutoPause: =false
            Duration: =nfTickMs
            Start: =!ctxPaused
            Visible: =false
            X: =0
            Y: =0
            Width: =120
            Height: =24
            OnTimerEnd: |-
              =// ---- sIn: input (outputs of the view, read once per tick) ----
              UpdateContext({sIn:
                With(
                  {k: If(ctxMode = "Playing", Coalesce(pcfView.Keys, 0), 0),
                   yaw: Coalesce(pcfView.Yaw, ctxYaw),
                   useNow: Coalesce(pcfView.UseSeq, 0) <> ctxUseSeen,
                   wpnNow: Coalesce(pcfView.WeaponSeq, 0) <> ctxWeaponSeen},
                  With(
                    {fwd: B2N(Bit(k, 1)) - B2N(Bit(k, 2)),
                     str: B2N(Bit(k, 8)) - B2N(Bit(k, 4)),
                     spd: If(Bit(k, 16), nfRun, nfWalk),
                     rad: Radians(yaw)},
                    With(
                      {f: If(fwd <> 0 && str <> 0, 0.7071, 1)},
                      {tick: ctxTick + 1, k: k, yaw: yaw, rad: rad,
                       fire: Bit(k, 32),
                       use: useNow && ctxMode = "Playing",
