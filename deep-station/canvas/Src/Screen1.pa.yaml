Screens:
  Screen1:
    Properties:
      Fill: =RGBA(12, 13, 15, 1)
      LoadingSpinnerColor: =RGBA(232, 208, 128, 1)
      OnVisible: |-
        =UpdateContext({ctxSlots: nfMaxSlots, ctxSpawn: 0, ctxDiag: true, ctxMuted: false, ctxMenuSeen: Coalesce(pcfView.MenuSeq, 0)});
        UpdateContext({
          ctxMode: "Playing", ctxTick: 0, ctxStartTime: Now(), ctxPaused: false, ctxSpawn: ctxSpawn + 1,
          ctxPX: nfStartX, ctxPY: nfStartY, ctxYaw: nfStartYaw, ctxHealth: 100, ctxArmor: 0,
          ctxWeapon: 2, ctxAmmoRivet: 50, ctxCooldown: 0, ctxWFrame: 0, ctxFlash: 0, ctxHurtTicks: 0,
          ctxDoors: "0000000000000000", ctxDoorAnimId: 0, ctxDoorAnimStep: 0, ctxChips: "000",
          ctxTaken: "00", ctxKills: 0, ctxEvents: "", ctxMsg: "", ctxMsgTicks: 0, ctxHazardTicks: 0,
          ctxUseSeen: Coalesce(pcfView.UseSeq, 0), ctxWeaponSeen: Coalesce(pcfView.WeaponSeq, 0), ctxEcho: 0,
          ctxE1K: 1, ctxE1X: 10.5, ctxE1Y: 2.5, ctxE1S: If(1 <= ctxSlots, 1, 0), ctxE1H: 20, ctxE1T: 0, ctxE1V: false, ctxE1F: 0,
          ctxE2K: 1, ctxE2X: 14.5, ctxE2Y: 4.5, ctxE2S: If(2 <= ctxSlots, 1, 0), ctxE2H: 20, ctxE2T: 0, ctxE2V: false, ctxE2F: 0,
          ctxE3K: 1, ctxE3X: 22.5, ctxE3Y: 2.5, ctxE3S: If(3 <= ctxSlots, 1, 0), ctxE3H: 20, ctxE3T: 0, ctxE3V: false, ctxE3F: 0,
          ctxE4K: 1, ctxE4X: 24.5, ctxE4Y: 4.5, ctxE4S: If(4 <= ctxSlots, 1, 0), ctxE4H: 20, ctxE4T: 0, ctxE4V: false, ctxE4F: 0,
          ctxE5K: 1, ctxE5X: 3.5, ctxE5Y: 9.5, ctxE5S: If(5 <= ctxSlots, 1, 0), ctxE5H: 20, ctxE5T: 0, ctxE5V: false, ctxE5F: 0,
          ctxE6K: 1, ctxE6X: 3.5, ctxE6Y: 12.5, ctxE6S: If(6 <= ctxSlots, 1, 0), ctxE6H: 20, ctxE6T: 0, ctxE6V: false, ctxE6F: 0,
          ctxE7K: 1, ctxE7X: 12.5, ctxE7Y: 10.5, ctxE7S: If(7 <= ctxSlots, 1, 0), ctxE7H: 20, ctxE7T: 0, ctxE7V: false, ctxE7F: 0,
          ctxE8K: 1, ctxE8X: 14.5, ctxE8Y: 12.5, ctxE8S: If(8 <= ctxSlots, 1, 0), ctxE8H: 20, ctxE8T: 0, ctxE8V: false, ctxE8F: 0,
          ctxE9K: 1, ctxE9X: 22.5, ctxE9Y: 8.5, ctxE9S: If(9 <= ctxSlots, 1, 0), ctxE9H: 20, ctxE9T: 0, ctxE9V: false, ctxE9F: 0,
          ctxE10K: 1, ctxE10X: 25.5, ctxE10Y: 10.5, ctxE10S: If(10 <= ctxSlots, 1, 0), ctxE10H: 20, ctxE10T: 0, ctxE10V: false, ctxE10F: 0,
          ctxE11K: 1, ctxE11X: 20.5, ctxE11Y: 13.5, ctxE11S: If(11 <= ctxSlots, 1, 0), ctxE11H: 20, ctxE11T: 0, ctxE11V: false, ctxE11F: 0,
          ctxE12K: 1, ctxE12X: 24.5, ctxE12Y: 13.5, ctxE12S: If(12 <= ctxSlots, 1, 0), ctxE12H: 20, ctxE12T: 0, ctxE12V: false, ctxE12F: 0
        })
    Children:
      - pcfView:
          Control: CodeComponent
          ComponentName: wrk_DeepStation.RaycastView
          Properties:
            X: =203
            Y: =10
            Width: =960
            Height: =600
            MapData: =nfMapData
            LightData: =nfLight
            TickMs: =nfTickMs
            Paused: =ctxPaused
            ShowDiag: =ctxDiag
            Muted: =ctxMuted
            ShowTouch: =false
            Frame: |-
              =ctxTick & "|" & Num(ctxPX) & "|" & Num(ctxPY) & "|" & ctxWeapon & "|" & ctxWFrame & "|" & ctxFlash & "|" & ctxDoors & "|" &
                  If(1 <= ctxSlots && ctxE1S > 0, "1," & ctxE1K & "," & ctxE1F & "," & Num(ctxE1X) & "," & Num(ctxE1Y) & "," & ctxE1S & ";") &
                  If(2 <= ctxSlots && ctxE2S > 0, "2," & ctxE2K & "," & ctxE2F & "," & Num(ctxE2X) & "," & Num(ctxE2Y) & "," & ctxE2S & ";") &
                  If(3 <= ctxSlots && ctxE3S > 0, "3," & ctxE3K & "," & ctxE3F & "," & Num(ctxE3X) & "," & Num(ctxE3Y) & "," & ctxE3S & ";") &
                  If(4 <= ctxSlots && ctxE4S > 0, "4," & ctxE4K & "," & ctxE4F & "," & Num(ctxE4X) & "," & Num(ctxE4Y) & "," & ctxE4S & ";") &
                  If(5 <= ctxSlots && ctxE5S > 0, "5," & ctxE5K & "," & ctxE5F & "," & Num(ctxE5X) & "," & Num(ctxE5Y) & "," & ctxE5S & ";") &
                  If(6 <= ctxSlots && ctxE6S > 0, "6," & ctxE6K & "," & ctxE6F & "," & Num(ctxE6X) & "," & Num(ctxE6Y) & "," & ctxE6S & ";") &
                  If(7 <= ctxSlots && ctxE7S > 0, "7," & ctxE7K & "," & ctxE7F & "," & Num(ctxE7X) & "," & Num(ctxE7Y) & "," & ctxE7S & ";") &
                  If(8 <= ctxSlots && ctxE8S > 0, "8," & ctxE8K & "," & ctxE8F & "," & Num(ctxE8X) & "," & Num(ctxE8Y) & "," & ctxE8S & ";") &
                  If(9 <= ctxSlots && ctxE9S > 0, "9," & ctxE9K & "," & ctxE9F & "," & Num(ctxE9X) & "," & Num(ctxE9Y) & "," & ctxE9S & ";") &
                  If(10 <= ctxSlots && ctxE10S > 0, "10," & ctxE10K & "," & ctxE10F & "," & Num(ctxE10X) & "," & Num(ctxE10Y) & "," & ctxE10S & ";") &
                  If(11 <= ctxSlots && ctxE11S > 0, "11," & ctxE11K & "," & ctxE11F & "," & Num(ctxE11X) & "," & Num(ctxE11Y) & "," & ctxE11S & ";") &
                  If(12 <= ctxSlots && ctxE12S > 0, "12," & ctxE12K & "," & ctxE12F & "," & Num(ctxE12X) & "," & Num(ctxE12Y) & "," & ctxE12S & ";") &
                  If(Mid(ctxTaken, 1, 1) = "0", "101,21,0,5.50,2.50,1;") &
                  If(Mid(ctxTaken, 2, 1) = "0", "102,22,0,2.50,4.50,1;") &
                  nfDecorSprites &
                  "|" & ctxEvents & "|" & Text(ctxEcho, "0") & "|" & ctxSpawn & ":" & Num(nfStartYaw)
            OnChange: |-
              =If(Coalesce(Self.MenuSeq, 0) <> ctxMenuSeen, UpdateContext({ctxPaused: !ctxPaused, ctxMenuSeen: Coalesce(Self.MenuSeq, 0)}))
