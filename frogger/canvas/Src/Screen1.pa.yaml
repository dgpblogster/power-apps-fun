Screens:
  Screen1:
    Properties:
      Fill: =RGBA(0, 67, 1, 1)
      LoadingSpinnerColor: =RGBA(64, 192, 64, 1)
      OnVisible: |-
        =UpdateContext({
          ctxMode: "Attract", ctxTick: 0, ctxModeTicks: 0, ctxStartTime: Now(), ctxPaused: false, ctxFrame: 0, ctxMuted: false, ctxKeys: false,
          ctxScore: 0, ctxHigh: 0, ctxLives: 5, ctxLevel: 1, ctxBays: "00000", ctxFast: false, ctxRacerPhase: 0, ctxLadyOn: false,
          ctxTwoPlayer: false, ctxPlayer: 1, ctxScoreP2: 0, ctxLivesP2: 0, ctxLevelP2: 1, ctxBaysP2: "00000",

          ctxFrogX: nfFrogStartX, ctxFrogRow: nfStartRow, ctxFrogDir: "U", ctxHopTicks: 0, ctxHopQueued: "",
          ctxLockTicks: 10, ctxBestRow: nfStartRow, ctxTime: nfTimeTicks, ctxDeathKind: "", ctxHasLady: false,
          ctxDivePair: 0, ctxDiveTrio: 0, ctxBayTimer: 0, ctxBayCursor: 1, ctxSnakeX: 72, ctxSnakeDir: 1, ctxGatorOn: false,
          ctxSndJingle: 0, ctxSndHop: 0, ctxSndSquash: 0, ctxSndDrown: 0, ctxSndWarn: 0, ctxSndHome: 0,
          ctxSndBonus: 0, ctxSndFanfare: 0, ctxSndPickup: 0, ctxSndExtra: 0, ctxSndOver: 0
        ,
          ctxOff1: 0, ctxOff2: 0, ctxOff3: 0, ctxOff4: 0, ctxOff5: 0, ctxOff6: 0, ctxOff7: 0, ctxOff8: 0, ctxOff9: 0,
          ctxN1: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 1, 1)), ctxN2: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 2, 1)), ctxN3: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 3, 1)), ctxN4: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 4, 1)), ctxN5: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 5, 1)), ctxN6: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 6, 1)), ctxN7: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 7, 1)), ctxN8: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 8, 1)), ctxN9: Value(Mid(nfTiers, Mod((1) - 1, 5) * 9 + 9, 1))
        })
    Children:
      - imgField:
          Control: Image@2.2.3
          Properties:
            Image: =Switch(Mod(ctxLevel - 1, 3), 0, nfImgField1, 1, nfImgField2, nfImgField3)
            ImagePosition: =ImagePosition.Fill
            X: =nfLeft
            Y: =nfTop
            Width: =160 * nfCol
            Height: =240 * nfLine
            AccessibleLabel: ="Field"
            TabIndex: =-1
      - lblTime:
          Control: Label@2.5.1
          Properties:
            Text: ="TIME"
            Color: =RGBA(255, 0, 0, 1)
            Align: =Align.Left
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =nfLeft + (2) * nfCol
            Y: =nfTop + (202) * nfLine
            Width: =16 * nfCol
            Height: =12 * nfLine
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =true
      - recTimeBand:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(ctxTime <= 100, RGBA(255, 0, 0, 1), RGBA(255, 137, 0, 1))
            X: =nfLeft + (44) * nfCol
            Y: =nfTop + (204) * nfLine
            Width: =Max(0, 97 * ctxTime / nfTimeTicks) * nfCol
            Height: =8 * nfLine
            BorderThickness: =0
      - lblSpeed:
          Control: Label@2.5.1
          Properties:
            Text: =If(ctxFast, "FAST", "SLOW")
            Color: =RGBA(64, 192, 64, 1)
            Align: =Align.Left
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =nfLeft + (4) * nfCol
            Y: =nfTop + (6) * nfLine
            Width: =40 * nfCol
            Height: =12 * nfLine
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =true
      - lblScore:
          Control: Label@2.5.1
          Properties:
            Text: ="1UP " & If(ctxPlayer = 1, ctxScore, ctxScoreP2)
            Color: =RGBA(128, 192, 255, 1)
            Align: =Align.Left
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =nfLeft + (4) * nfCol
            Y: =nfTop + (222) * nfLine
            Width: =60 * nfCol
            Height: =12 * nfLine
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =true
      - lblScore2:
          Control: Label@2.5.1
