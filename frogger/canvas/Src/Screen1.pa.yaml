            Text: ="2UP " & If(ctxPlayer = 2, ctxScore, ctxScoreP2)
            Color: =RGBA(128, 192, 255, 1)
            Align: =Align.Right
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =nfLeft + (96) * nfCol
            Y: =nfTop + (222) * nfLine
            Width: =60 * nfCol
            Height: =12 * nfLine
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =ctxTwoPlayer && ctxMode <> "Attract"
      - lblTurn:
          Control: Label@2.5.1
          Properties:
            Text: =If(ctxMode = "Attract", If(ctxTwoPlayer, "2 PLAYERS", "1 PLAYER"), ctxPlayer & " UP")
            Color: =RGBA(64, 192, 64, 1)
            Align: =Align.Center
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =nfLeft + (60) * nfCol
            Y: =nfTop + (222) * nfLine
            Width: =40 * nfCol
            Height: =12 * nfLine
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            Wrap: =false
            Visible: =ctxMode = "Attract" || (ctxTwoPlayer && (ctxMode = "Jingle" || ctxMode = "GameOver"))
